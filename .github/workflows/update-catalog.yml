name: update-catalog
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-catalog.mjs
        working-directory: engineering-ai
      - run: |
          git config user.name "catalog-bot"
          git config user.email "bot@users.noreply.github.com"
          git add engineering-ai/public/catalog.json
          git diff --cached --quiet || (git commit -m "تحديث فهرس الملفات" && git push)
